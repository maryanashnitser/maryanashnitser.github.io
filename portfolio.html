  <style>

    .page-header { margin-bottom: 3rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1.5rem; }
    .page-header h1 { font-family: var(--font-display); font-size: 2.5rem; font-weight: 500; }
    .page-header p { color: var(--color-muted); margin-top: 0.5rem; }

    .section-label {
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-muted);
      font-weight: 300;
      margin: 2rem 0 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-border);
    }

    .projects {
      columns: 2;
      gap: 1rem;
    }

    .project-card {
      break-inside: avoid;
      margin-bottom: 1rem;
      border: none;
      background: transparent;
    }

    .project-card img {
      width: 100%;
      object-fit: contain;
    }

    .project-card img:hover {
      opacity: 0.85;
    }

    @media (max-width: 768px) {
      .projects { columns: 2; }
    }

    /* ---------- Slider ---------- */
    .slider {
      position: relative;
    }

    .projects--slider {
      columns: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .projects--slider::-webkit-scrollbar {
      display: none;
    }

    .projects--slider .project-card {
      flex: 0 0 auto;
      margin-bottom: 0;
      scroll-snap-align: start;
    }

    .projects--slider .project-card img {
      height: 320px;
      width: auto;
      max-width: none;
      display: block;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--color-border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
    }

    .slider-btn:hover {
      background: #fff;
    }

    .slider-btn--prev { left: 0.5rem; }
    .slider-btn--next { right: 0.5rem; }

    @media (max-width: 768px) {
      .projects--slider .project-card img { height: 220px; }
    }

  </style>

  <!-- slider-->
  <script>
    document.querySelectorAll('.slider').forEach(function (slider) {
      var track = slider.querySelector('.projects--slider');
      var prev = slider.querySelector('.slider-btn--prev');
      var next = slider.querySelector('.slider-btn--next');

      function step() {
        return track.clientWidth * 0.8;
      }

      prev.addEventListener('click', function () {
        track.scrollBy({ left: -step(), behavior: 'smooth' });
      });

      next.addEventListener('click', function () {
        track.scrollBy({ left: step(), behavior: 'smooth' });
      });
    });
  </script>
